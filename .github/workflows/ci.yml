name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-and-migrations:
    name: Tests i migracions
    runs-on: ubuntu-latest
    # A75 inspecciona perfiles completos en cada TX; margen para full suite fresca.
    # Ningún resultado parcial ni timeout se considera PASS.
    timeout-minutes: 180
    env:
      PYTHON_DOTENV_DISABLED: "1"
      NOESIS_FINANCIAL_CORE_ENABLED: "false"
      NOESIS_LEDGER_REPORTING_ENABLED: "false"
      NOESIS_OPEN_ITEMS_ENABLED: "false"
      NOESIS_NEW_TAX_ENGINE_ENABLED: "false"
      NOESIS_NEW_BANK_RECONCILIATION_ENABLED: "false"

    steps:
      - name: Descarregar el repositori
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolver base del delta según evento
        id: validation-base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          valid_commit() {
            [[ "$1" =~ ^[0-9a-f]{40}$ ]] &&
            [[ "$1" != "0000000000000000000000000000000000000000" ]] &&
            git cat-file -e "$1^{commit}" 2>/dev/null
          }
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            valid_commit "$base"
          elif [[ "$EVENT_NAME" == "push" ]] && valid_commit "$PUSH_BEFORE"; then
            base="$PUSH_BEFORE"
          else
            git fetch --no-tags origin main
            base="$(git merge-base HEAD origin/main)"
            valid_commit "$base"
          fi
          printf 'base=%s\n' "$base" >> "$GITHUB_OUTPUT"

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Configurar uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Instal·lar el projecte
        id: install-project
        run: uv sync --locked --extra security --extra test

      - name: Auditar dependències
        if: ${{ !cancelled() && steps.install-project.outcome == 'success' }}
        run: uv run pip-audit

      - name: Detectar secrets nous
        if: ${{ !cancelled() && steps.install-project.outcome == 'success' }}
        shell: bash
        run: uv run python -X utf8 scripts/check_secrets.py

      - name: Validar enlaces internos del delta sin red
        if: ${{ !cancelled() && steps.install-project.outcome == 'success' }}
        env:
          VALIDATION_BASE: ${{ steps.validation-base.outputs.base }}
        run: uv run python scripts/check_doc_links.py --base-ref "$VALIDATION_BASE" --head-ref HEAD

      - name: Validar whitespace del rango de commits
        if: ${{ !cancelled() && steps.install-project.outcome == 'success' }}
        env:
          VALIDATION_BASE: ${{ steps.validation-base.outputs.base }}
        run: git diff --check "$VALIDATION_BASE" HEAD

      - name: Analitzar patrons de seguretat
        if: ${{ !cancelled() && steps.install-project.outcome == 'success' }}
        run: uv run bandit -r src/noesis -q -lll -iii

      - name: Detectar errors estàtics
        if: ${{ !cancelled() && steps.install-project.outcome == 'success' }}
        run: uv run ruff check src tests scripts/check_doc_links.py scripts/check_schema_lineage.py scripts/build_schema_profiles.py scripts/run_postgres_backup_lab.py

      - name: Validar demostración pública y calendario sin red
        if: ${{ !cancelled() && steps.install-project.outcome == 'success' }}
        run: node --test tests/public_marketing.test.cjs tests/public_calendar.test.cjs tests/admin_economia.test.cjs tests/financial_channels.test.cjs tests/local_dates.test.cjs

      - name: Validar catálogo append-only y collision guard
        if: ${{ !cancelled() && steps.install-project.outcome == 'success' }}
        run: uv run python scripts/check_schema_lineage.py --main-ref origin/main

      - name: Validar la font de veritat del projecte
        if: ${{ !cancelled() && steps.install-project.outcome == 'success' }}
        shell: bash
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            uv run python scripts/check_project_truth.py --base-ref "${{ github.event.pull_request.base.sha }}"
          else
            uv run python scripts/check_project_truth.py
          fi

      - name: Executar tots els tests
        if: ${{ !cancelled() && steps.install-project.outcome == 'success' }}
        env:
          NOESIS_SECRET: noesis-ci-secret-fixed-32-characters-minimum
          NOESIS_DB_PATH: ${{ runner.temp }}/noesis-ci-tests.db
        run: uv run python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validar el cicle complet de migracions
        if: ${{ !cancelled() && steps.install-project.outcome == 'success' }}
        env:
          NOESIS_SECRET: noesis-ci-secret-fixed-32-characters-minimum
          NOESIS_DB_PATH: ${{ runner.temp }}/noesis-ci-migrations.db
        run: |
          uv run python -m noesis.migrations upgrade
          uv run python - <<'PY'
          from noesis import migrations

          actual = migrations.current_version()
          assert actual == migrations.LATEST_VERSION, (
              f"La versió actual és {actual}, s'esperava {migrations.LATEST_VERSION}"
          )
          PY

          uv run python -m noesis.migrations downgrade 0
          uv run python - <<'PY'
          from noesis import migrations

          actual = migrations.current_version()
          assert actual == 0, f"La versió actual és {actual}, s'esperava 0"
          PY

          uv run python -m noesis.migrations upgrade
          uv run python - <<'PY'
          from noesis import migrations

          actual = migrations.current_version()
          assert actual == migrations.LATEST_VERSION, (
              f"La versió actual és {actual}, s'esperava {migrations.LATEST_VERSION}"
          )
          PY

  postgres-smoke:
    name: PostgreSQL18 y POSTGRES_BACKUP_V2 sin outbound
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHON_DOTENV_DISABLED: "1"
      NOESIS_FINANCIAL_CORE_ENABLED: "false"
      NOESIS_LEDGER_REPORTING_ENABLED: "false"
      NOESIS_OPEN_ITEMS_ENABLED: "false"
      NOESIS_NEW_TAX_ENGINE_ENABLED: "false"
      NOESIS_NEW_BANK_RECONCILIATION_ENABLED: "false"
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Configurar uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Instalar el proyecto
        run: uv sync --locked
      - name: Instalar Mise versionado y PostgreSQL18 con lockfile
        shell: bash
        run: |
          curl -fsSL https://github.com/jdx/mise/releases/download/v2026.10.8/mise-v2026.10.8-linux-x64.tar.gz -o "$RUNNER_TEMP/mise.tar.gz"
          (cd "$RUNNER_TEMP" && sha256sum -c "$GITHUB_WORKSPACE/scripts/mise-linux-x64.sha256")
          tar -xzf "$RUNNER_TEMP/mise.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/mise/bin/mise" trust
          "$RUNNER_TEMP/mise/bin/mise" install --locked
          "$RUNNER_TEMP/mise/bin/mise" exec -- python scripts/check_postgres_toolchain.py
      - name: Obtener código base para rollback seguro
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: d3740a052432a29c9306bf16629a711384df9352 # pragma: allowlist secret
          path: .legacy-baseline
      - name: Obtener cadena financiera histórica sólo para fixture sintético legacy79
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 87055215bcbacf6fefa9f6473a87a7d208885f0c # pragma: allowlist secret; public frozen fixture SHA
          path: .legacy-financial-fixture
      - name: Todas las matrices del release y V2 en instancia nueva aislada
        shell: bash
        run: |
          tool_bin="$($RUNNER_TEMP/mise/bin/mise where conda:postgresql)/bin"
          sudo unshare --net bash -c 'ip link set lo up; runuser -u "$1" -- env PYTHONPATH="$2/src" NOESIS_POSTGRES_BIN="$3" "$2/.venv/bin/python" "$2/scripts/run_postgres_backup_lab.py"' _ "$(id -un)" "$PWD" "$tool_bin"
