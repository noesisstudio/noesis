name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-and-migrations:
    name: Tests i migracions
    runs-on: ubuntu-latest
    # La suite completa ya roza 15 min en runners compartidos y después valida
    # upgrade/downgrade/upgrade. El límite debe detectar bloqueos, no cancelar QA sano.
    timeout-minutes: 25

    steps:
      - name: Descarregar el repositori
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Configurar uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Instal·lar el projecte
        run: uv sync --locked --extra security --extra test

      - name: Auditar dependències
        run: uv run pip-audit

      - name: Detectar secrets nous
        shell: bash
        run: uv run detect-secrets-hook --baseline .secrets.baseline $(git ls-files)

      - name: Analitzar patrons de seguretat
        run: uv run bandit -r src/noesis -q -lll -iii

      - name: Detectar errors estàtics
        run: uv run ruff check src tests

      - name: Validar la font de veritat del projecte
        shell: bash
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            uv run python scripts/check_project_truth.py --base-ref "${{ github.event.pull_request.base.sha }}"
          else
            uv run python scripts/check_project_truth.py
          fi

      - name: Executar tots els tests
        env:
          NOESIS_SECRET: noesis-ci-secret-fixed-32-characters-minimum
          NOESIS_DB_PATH: ${{ runner.temp }}/noesis-ci-tests.db
        run: uv run python -m unittest discover -s tests -p "test_*.py"

      - name: Validar el cicle complet de migracions
        env:
          NOESIS_SECRET: noesis-ci-secret-fixed-32-characters-minimum
          NOESIS_DB_PATH: ${{ runner.temp }}/noesis-ci-migrations.db
        run: |
          uv run python -m noesis.migrations upgrade
          uv run python - <<'PY'
          from noesis import migrations

          actual = migrations.current_version()
          assert actual == migrations.LATEST_VERSION, (
              f"La versió actual és {actual}, s'esperava {migrations.LATEST_VERSION}"
          )
          PY

          uv run python -m noesis.migrations downgrade 0
          uv run python - <<'PY'
          from noesis import migrations

          actual = migrations.current_version()
          assert actual == 0, f"La versió actual és {actual}, s'esperava 0"
          PY

          uv run python -m noesis.migrations upgrade
          uv run python - <<'PY'
          from noesis import migrations

          actual = migrations.current_version()
          assert actual == migrations.LATEST_VERSION, (
              f"La versió actual és {actual}, s'esperava {migrations.LATEST_VERSION}"
          )
          PY

  postgres-smoke:
    name: Humo contra Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: noesis
          POSTGRES_PASSWORD: noesis
          POSTGRES_DB: noesis_ci
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U noesis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://noesis:noesis@localhost:5432/noesis_ci
      NOESIS_SECRET: noesis-ci-secret-fixed-32-characters-minimum

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Configurar uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Instalar el proyecto
        run: uv sync --locked

      - name: Aplicar migraciones en Postgres con datos históricos
        run: |
          uv run python -m noesis.migrations upgrade 32
          uv run python tests/postgres_migration_smoke.py

      - name: Ejecutar humo Postgres
        run: uv run python tests/postgres_smoke.py

      - name: Obtener código base para rollback seguro
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: d3740a052432a29c9306bf16629a711384df9352 # pragma: allowlist secret
          path: .legacy-baseline

      - name: Validar código anterior sobre esquema nuevo
        env:
          PYTHONPATH: ${{ github.workspace }}/.legacy-baseline/src
        run: uv run python tests/postgres_legacy_smoke.py

      - name: Validar privacidad y rollback del candidato aislado
        env:
          NOESIS_VALUE_LEDGER_ENABLED: "false"
          NOESIS_VALUE_LEDGER_ADMIN_ENABLED: "false"
        run: uv run python tests/postgres_release_smoke.py
