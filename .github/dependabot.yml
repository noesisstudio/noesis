version: 2
updates:
  # El proyecto instala con uv y CI exige uv.lock sincronizado. Usar el
  # ecosistema "pip" solo actualizaba los manifiestos y dejaba el lock obsoleto.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    # Un PR por dependencia: facilita revisar, probar y revertir. Las versiones
    # mayores se planifican manualmente; esta regla no bloquea security updates.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "build(deps)"
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build(deps)"
      include: scope
