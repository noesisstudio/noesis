<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noesis · Entrar</title>
  <link rel="icon" href="/static/noesis-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css?v=ux-piloto">
  <style>
    .center { min-height:100vh; display:grid; place-items:center; padding:24px; }
    .login-shell { width:100%; max-width:420px; }
    .err { background:var(--red-soft); color:var(--red); border-radius:8px;
      padding:10px 12px; font-size:13.5px; margin-bottom:14px; }
  </style>
</head>
<body>
  <div class="center">
    <div class="login-shell">
      <div style="text-align:center; margin-bottom:24px">
        <img src="/static/noesis-mark.svg" width="52" height="52" alt="">
        <div style="font-size:30px; font-weight:700; letter-spacing:0; color:var(--brand)">Noesis</div>
        <p style="color:var(--muted); margin-top:6px">Entra para gestionar agenda, cobros y facturas.</p>
      </div>

      <div class="card pad">
        {% if error %}<div class="err">Email o contraseña incorrectos.</div>{% endif %}
        <form method="post" action="/login">
          <label class="fld">Email</label>
          <input class="input" name="email" type="email" required placeholder="tu@email.com">
          <label class="fld" style="margin-top:14px">Contraseña</label>
          <input class="input" name="password" type="password" required>
          <button class="btn primary full" style="margin-top:18px">Entrar</button>
        </form>
        <div class="demo">Demo: <b>demo@bynoesis.com</b> / <b>demo1234</b></div>
      </div>
      <a href="/onboarding" style="display:block;text-align:center;color:var(--faint); font-size:13px; margin-top:22px">¿Nuevo? Crea tu cuenta</a>
    </div>
  </div>
</body>
</html>
