[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "noesis"
version = "0.1.0"
description = "Copiloto de negocio por WhatsApp para autónomos de servicios"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.117.0,<1",
    "python-dotenv>=1.2.2,<2",
    "defusedxml>=0.7.1,<1",
    "psycopg[binary]>=3.3.4,<4",
    "psycopg_pool>=3.3.1,<4",
    "rich>=15.0.0,<16",
    "fastapi>=0.139.2,<1",
    "uvicorn[standard]>=0.51.0,<1",
    "jinja2>=3.1.6,<4",
    "apscheduler>=3.11.3,<4",
    "python-multipart>=0.0.32,<1",
    "itsdangerous>=2.2.0,<3",
    "fpdf2>=2.8.7,<3",
    # Se usa de forma directa para validar imágenes antes de OCR/almacenamiento.
    "pillow>=12.3.0,<13",
    # Generador QR puro Python; Pillow ya es dependencia transitiva de fpdf2.
    "qrcode>=8.2,<9",
]

[project.optional-dependencies]
# Transcripción de voz local (notas de voz -> factura/agenda). Pesa y pide RAM,
# por eso es opcional: pip install -e ".[audio]"
audio = ["faster-whisper>=1.2.1,<2"]
security = [
    "bandit>=1.9.4,<2",
    "detect-secrets>=1.5.0,<2",
    "pip-audit>=2.10.1,<3",
    "ruff>=0.15.22,<1",
]
test = ["hypothesis>=6.158.0,<7"]

[project.scripts]
noesis = "noesis.cli:main"
noesis-web = "noesis.web.server:main"
noesis-doctor = "noesis.readiness:main"
noesis-restore-check = "noesis.web.backups:restore_check_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Guardia acotada: errores reales, fallos de sintaxis e imports. Bandit cubre
# seguridad por separado; mezclar ambos conjuntos escondería riesgos entre ruido.
select = ["E4", "E7", "E9", "F"]
ignore = ["E731", "E741"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".worktrees"]
